<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Harmony Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;800&display=swap" rel="stylesheet" />
  <script type="module" crossorigin src="/assets/index-DrrVN-TA.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-B5mr8nyj.css">
</head>
<body>
  <div id="app">

    <header id="header">
      <div class="logo">
        <svg class="logo-mark" width="18" height="18" viewBox="0 0 18 18" fill="none">
          <polygon points="9,1 17,5 17,13 9,17 1,13 1,5" fill="none" stroke="#c8ff57" stroke-width="1.5"/>
          <line x1="9" y1="1" x2="9" y2="17" stroke="#c8ff57" stroke-width="1"/>
          <line x1="1" y1="5" x2="17" y2="13" stroke="#c8ff57" stroke-width="1"/>
          <line x1="17" y1="5" x2="1" y2="13" stroke="#c8ff57" stroke-width="1"/>
        </svg>
        <span class="logo-text">Harmony Studio</span>
      </div>
      <div id="status-bar">Ready — drop an audio file to begin</div>
    </header>

    <div id="wave-area">
      <div id="drop-zone">
        <svg class="drop-icon" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round">
          <path d="M9 18V5l12-2v13"/>
          <circle cx="6" cy="18" r="3"/>
          <circle cx="18" cy="16" r="3"/>
        </svg>
        <p class="drop-label">Drop audio here</p>
        <p class="drop-sub">MP3 &nbsp;·&nbsp; WAV &nbsp;·&nbsp; M4A &nbsp;·&nbsp; OGG</p>
        <label class="browse-btn" for="file-input">Browse files</label>
        <input type="file" id="file-input" accept=".mp3,.wav,.m4a,.ogg,audio/*" />
      </div>
      <canvas id="waveform" class="hidden"></canvas>
    </div>

    <div id="controls" class="hidden">
      <section class="panel voices-panel">
        <div class="panel-label">Harmony Voices</div>
        <div class="voice-grid">
          <button class="voice-btn" data-semitones="4">
            <span class="voice-name">Maj 3rd</span>
            <span class="voice-interval">+4 st</span>
          </button>
          <button class="voice-btn" data-semitones="7">
            <span class="voice-name">Perf 5th</span>
            <span class="voice-interval">+7 st</span>
          </button>
          <button class="voice-btn" data-semitones="-5">
            <span class="voice-name">4th Below</span>
            <span class="voice-interval">−5 st</span>
          </button>
          <button class="voice-btn" data-semitones="12">
            <span class="voice-name">Oct Up</span>
            <span class="voice-interval">+12 st</span>
          </button>
        </div>
      </section>

      <section class="panel mix-panel">
        <div class="panel-label">Mix</div>
        <div class="mixer">
          <div class="mixer-row">
            <label for="lead-gain">Lead</label>
            <input type="range" id="lead-gain" min="0" max="1" step="0.01" value="0.8" />
            <output id="lead-gain-val">80%</output>
          </div>
          <div class="mixer-row">
            <label for="harmony-gain">Harmony</label>
            <input type="range" id="harmony-gain" min="0" max="1" step="0.01" value="0.6" />
            <output id="harmony-gain-val">60%</output>
          </div>
        </div>
      </section>

      <section class="panel actions-panel">
        <button id="play-btn" class="action-btn play-btn" disabled>
          <span id="play-icon">▶</span>
          <span id="play-label">Play</span>
        </button>
        <button id="download-btn" class="action-btn dl-btn" disabled>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          <span>Download Mix</span>
        </button>
      </section>
    </div>

  </div>
</body>
</html>
